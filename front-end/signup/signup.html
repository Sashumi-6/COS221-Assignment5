<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="signup.css">
    <link rel="stylesheet" href="../global/styles.css">

    <title>[SignUp]</title>
</head>
<body>
    <p id="title" class="roboto-normal">SIGNUP</p>
    <div id="signup-container">
        <div id="signup-options">
            <input class="roboto-normal" autocapitalize="on" autocomplete="on" type="text" name="first-name" id="first-name-input" placeholder="First Name">
            <input class="roboto-normal" autocapitalize="on" autocomplete="on" type="text" name="last-name" id="last-name-input" placeholder="Last Name">
            <input class="roboto-normal" autocomplete="on" type="text" name="username" id="username-input" placeholder="Username">
            <input class="roboto-normal" autocomplete="on" type="email" name="email" id="email-input" placeholder="Email">
            <input class="roboto-normal" type="password" name="password" id="password-input" placeholder="Password">
        </div>

        <div id="buttons">
            <button class="roboto-normal" id="signup-button">Sign Up</button>
            <button class="roboto-normal" id="goback-button">Go back</button>
        </div>
    </div>
</body>
</html>
