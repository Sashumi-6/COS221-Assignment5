<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Coda:wght@400;800&family=Roboto:ital,wdth,wght@0,75..100,100..900;1,75..100,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="../global/styles.css">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="admin.js"></script>

    <title>[Admin View]</title>
</head>
<body>
    <div id="admin-container">
        <div id="top-bar" class="roboto-normal">
            <!-- <div id="filter-options-container">
                <span class="component filter-label">Filters:</span>
                <a class="component">Alphabetical</a>
                <a class="component">Category</a>
                <a class="component">Brand</a>
            </div> -->

            <!-- TODO style search -->
            <div id="search-container">
                <input id="bar" class="component" type="text" placeholder="Search Products & Users">
            </div>
        </div>

        <div id="content-container">
            <div id="side-content">
                <div id="categories-container" class="side-content-display">
                    <a id="title" class="roboto-normal">Categories</a>
                    <div id="list-items"></div>
                </div>
                <div id="stockist-container" class="side-content-display">
                    <a id="title">Stockists</a>
                    <div id="list-items"></div>
                </div>

                <div id="filter-options-container">
                    <span class="component filter-label">Filters:</span>
                    <select id="sort-select" class="component">
                        <option value="">Sort By</option>
                        <option value="az">A → Z</option>
                        <option value="za">Z → A</option>
                    </select>

                    <select id="brand-select" class="component">
                        <option value="">Filter by Brand</option>
                        <!-- JS will fill this dynamically -->
                    </select>

                    <select id="category-select" class="component">
                    <option value="">All Categories</option>
                    <!-- JS will fill this -->
                    </select>

                </div>
            </div>

            <div id="main-content">
                <!-- Maybe click on a thing to edit it and then click UPC to be redirected to the product? -->
                 <!-- TODO ADD SOMEWHERE TO ADD AN ITEM D:  -->
                <div id="products-container" class="main-content-display">
                    <a id="title">PRODUCTS</a>
                    <div id="heading">
                        <a>UPC</a>
                        <a>Name</a>
                        <a>Description</a>
                        <a>Category</a>
                        <a>Brand</a>
                        <a>Supplier</a>
                        <button style="visibility: hidden;">Delete</button>
                    </div>
                </div>

                <div id="users-container" class="main-content-display">
                    <a id="title">USERS</a>
                    <div id="heading">
                        <a>ID</a>
                        <a>Username</a>
                        <a>Full Name</a>
                        <a>Email</a>
                        <a>User Type</a>
                        <button style="visibility: hidden;">Delete</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
