<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Coda:wght@400;800&family=Roboto:ital,wdth,wght@0,75..100,100..900;1,75..100,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="global/styles.css">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="login.js"></script>

    <title>[Login Page]</title>
</head>
<body>
    <div id="login-container">
        <p id="title" class="roboto-normal">LOG IN</p>
        <div id="login-options">
            <input class="roboto-normal" autocomplete="on" type="text" name="username" id="username-input" placeholder="Username">
            <input class="roboto-normal" type="password" name="password" id="password-input" placeholder="Password">
        </div>

        <div id="buttons">
            <button class="buttons buttons-classic" id="login-button">Login</button>
             <button class="buttons buttons-classic" id="signup-button">Sign Up</button>
        </div>
    </div>

    <div class="top-products-widget">
        <h2>Top Rated Products</h2>
        <iframe src="user/review/review2.html" frameborder="0" style="width:100%; height:500px;"></iframe>
    </div>
</body>
</html>
