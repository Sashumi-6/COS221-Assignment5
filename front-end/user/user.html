<!DOCTYPE html>
<html>
  <head>
   <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" type="text/css" href="../admin/admin.css">
    <link rel="stylesheet" type="text/css" href="user.css">
    <link rel="stylesheet" href="../global/styles.css">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="user.js"></script>

    <title>[User View]</title>

  </head>
  <body>
     <div id="user-container">
        <div id="user-top-bar" class="roboto-normal">
  
            <!-- TODO style search -->
            <div id="search-container">
                <input id="bar" class="component" type="text" placeholder="placeholder-search">
            </div>
        </div>

        <div id="content-container" style="margin: 2.3em 1em;">
            <div id="side-content">
                <div id="categories-container" class="side-content-display">
                    <a id="title" class="roboto-normal">Categories</a>
                    <div id="list-items"></div>
                </div>
                <div id="filter-options-container">
                <select id="sort-select" class="component">
                    <option value="">Sort By</option>
                    <option value="az">A → Z</option>
                    <option value="za">Z → A</option>
                    <option value="priceLowHigh">Price: Low to High</option>
                    <option value="priceHighLow">Price: High to Low</option>
                </select>

                <select id="brand-select" class="component">
                    <option value="">Filter by Brand</option>
                    <!-- JS will fill this dynamically -->
                </select>
            </div>

            </div>
    
      <div class="container">
        <div class="product-card">
          <div class="product-image">
            <img src="https://cdn.shopify.com/s/files/1/0533/2089/files/placeholder-images-image_large.png?v=1530129081" alt="Product Image">
          </div>
          <div class="product-details">
            <h2 class="product-title">Product Name</h2>
            <p class="product-price">$9.99</p>
            <p class="product-description">This is a brief description of the product.</p>
              <button class="compare">View Product</button>
          </div>
        </div>
        <div class="product-card">
          <div class="product-image">
            <img src="https://cdn.shopify.com/s/files/1/0533/2089/files/placeholder-images-image_large.png?v=1530129081" alt="Product Image">
          </div>
          <div class="product-details">
            <h2 class="product-title">Product Name</h2>
            <p class="product-price">$9.99</p>
            <p class="product-description">This is a brief description of the product.</p>
            <div class="userbuttons userbuttons-classic">
              <button class="compare">View Product</button>
            </div>
          </div>
        </div>
        <div class="product-card">
          <div class="product-image">
            <img src="https://cdn.shopify.com/s/files/1/0533/2089/files/placeholder-images-image_large.png?v=1530129081" alt="Product Image">
          </div>
          <div class="product-details">
            <h2 class="product-title">Product Name</h2>
            <p class="product-price">$9.99</p>
            <p class="product-description">This is a brief description of the product.</p>
            <div class="userbuttons userbuttons-classic">
              <button class="compare">View Product</button>
            </div>
          </div>
        </div>
        <div class="product-card">
          <div class="product-image">
            <img src="https://cdn.shopify.com/s/files/1/0533/2089/files/placeholder-images-image_large.png?v=1530129081" alt="Product Image">
          </div>
          <div class="product-details">
            <h2 class="product-title">Product Name</h2>
            <p class="product-price">$9.99</p>
            <p class="product-description">This is a brief description of the product.</p>
            <div class="userbuttons userbuttons-classic">
              <button class="compare">View Product</button>
            </div>
          </div>
        </div>
      </div>
    </div>

</html>
