         .product-card {
  width: 300px;
  border-radius: 10px;
  margin: 0;
  position: relative;
  font-size: 1.875rem;
  padding: 1.5rem 3rem;
  font-weight: 600;
  border: none;
  transition: all 250ms;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  background-color: #dbd2d2;
  color: #242424;
  border-radius: 0.5rem;
  box-shadow: 
    inset 0 1px 0 0 #f4f4f4,
    0 1px 0 0 #efefef,
    0 2px 0 0 #ececec,
    0 4px 0 0 #e0e0e0,
    0 5px 0 0 #dedede,
    0 6px 0 0 #dcdcdc,
    0 7px 0 0 #cacaca,
    0 7px 8px 0 #cecece;
}

.product-image {
  height: 250px;
  width: 400px;
  overflow: hidden;
  position: relative;
  padding: 10px;
}

.product-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 10px;
}

.product-details {
  margin-top:0;
}

.product-title {
  font-size: 1.5rem;
  margin-bottom: 10px;
  color: #504b4b;
}

.product-price {
  font-size: 1.25rem;
  font-weight: bold;
  margin-bottom: 10px;
  color: #6e6969;
}

.product-description {
  font-size: 1rem;
  line-height: 1.5;
  margin-bottom: 10px;
  color: #666;
}
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="review.js"></script>
</head>

    <div class="products-container"></div>
